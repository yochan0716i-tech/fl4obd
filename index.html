<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>FL4 OBD MONITOR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#070b0f;color:#c8d8e8;font-family:'Courier New',monospace;min-height:100vh;}
.app{width:100%;margin:0;padding:0 6px 8px;}

/* HEADER — コントロールエリア（下部） */
.hdr{display:flex;align-items:center;justify-content:space-between;
  padding:8px 0 6px;border-top:1px solid #1a2a3a;border-bottom:none;margin-bottom:6px;margin-top:4px;}
.logo{font-size:11px;letter-spacing:3px;color:#3a8aff;font-weight:bold;}
.hdr-r{display:flex;align-items:center;gap:7px;}
.dot{width:9px;height:9px;border-radius:50%;background:#1e2e3e;
  border:1.5px solid #2a4a6a;transition:all .4s;}
.dot.on {background:#00ff88;border-color:#00cc66;box-shadow:0 0 7px #00ff8860;}
.dot.chk{background:#ffaa00;border-color:#cc8800;animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.stt{font-size:10px;letter-spacing:1px;color:#2a5a7a;}

/* LOG */
.log-wrap{position:relative;margin-bottom:8px;}
.log{background:#040810;border:1px solid #1a2a3a;border-radius:6px;
  padding:5px 9px 5px 9px;font-size:10px;color:#2a6a4a;height:60px;
  overflow-y:auto;line-height:1.7;}
.log .e {color:#cc3333;}
.log .ok{color:#22cc77;}
.log .tx{color:#3377cc;}
/* CONNECT */
.conn-btn{width:100%;padding:10px;background:#0d1e30;border:1px solid #2a5a8c;
  border-radius:7px;color:#4a9eff;font-family:'Courier New',monospace;
  font-size:11px;letter-spacing:2px;cursor:pointer;margin-bottom:10px;transition:all .2s;}
.conn-btn:hover  {background:#122840;border-color:#4a9eff;}
.conn-btn:active {transform:scale(.98);}
.conn-btn:disabled{opacity:.35;cursor:not-allowed;}
.conn-btn.rec{border-color:#cc3333 !important;color:#cc3333 !important;animation:blink 1s infinite;}
/* 下部サブボタン行: 5個を1行に収める。conn-btn の width:100%/padding/letter-spacing を
   打ち消し、flex で等分・縮小可にする。テキストは折り返さない。 */
.navbar{display:flex;gap:4px;margin-bottom:0;}
.navbar>*{flex:1 1 0;min-width:0;width:auto;margin-bottom:0;
  padding:9px 1px;font-size:10px;letter-spacing:0;white-space:nowrap;overflow:hidden;
  background:#0d1520;border-color:#1a3a5a;color:#2a5a7a;
  text-decoration:none;display:flex;align-items:center;justify-content:center;}
.conn-btn.rec:hover{border-color:#ff4444 !important;color:#ff4444 !important;}

/* 2x2 ANALOG METERS — 最上部・極力大きく */
.meters-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px;}
.meter-card{background:#0a1520;border:1px solid #1a2a3a;border-radius:10px;
  padding:6px 4px 4px;display:flex;flex-direction:column;align-items:center;}
.m-lbl{font-size:9px;letter-spacing:2px;color:#2a5a7a;margin-bottom:2px;}
.m-svg{width:100%;height:auto;}
.m-val{font-size:28px;font-weight:bold;letter-spacing:1px;line-height:1;margin-top:1px;}
.m-unit{font-size:9px;color:#2a5a7a;letter-spacing:1px;margin-top:1px;}
.m-val.rpm{color:#4a9eff;}
.m-val.spd{color:#00ff88;}
.m-val.pwr{color:#ffaa00;}
.m-val.soc{color:#00ffcc;}

/* SUB ROW */
.sub-row{display:flex;justify-content:space-between;background:#0a1520;
  border:1px solid #1a2a3a;border-radius:8px;padding:14px 16px;margin-bottom:8px;}
.sub-item{display:flex;flex-direction:column;align-items:center;gap:3px;}
.sub-item .sl{font-size:12px;color:#2a5a7a;letter-spacing:1px;}
.sub-item .sv{font-size:22px;font-weight:bold;color:#c8d8e8;}
.sub-item .sv.cur{color:#cc44ff;}


.demo-note{text-align:center;font-size:9px;color:#1a3a5a;letter-spacing:1px;padding:4px 0;}

::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:#040810;}
::-webkit-scrollbar-thumb{background:#1a3a5a;border-radius:2px;}

/* 2x2 ANALOG METERS */
.meters-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px;}
.meter-card{background:#0a1520;border:1px solid #1a2a3a;border-radius:10px;
  position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;}
.m-svg{position:absolute;top:0;left:0;width:100%;height:100%;}

/* ── 強制ポートレート ─────────────────────────────────────
   回転フリー端末を横に向けても縦表示を維持する。
   Orientation Lock API は iOS非対応/要フルスクリーンで実用外のため CSS で対処:
   タッチ端末が横向きのとき body を反回転し、縦アスペクトのまま描画する。 */
/* 判定は screen.orientation（端末の向き）。ビューポートの縦横比で判定すると
   **画面分割で横長のペインになったときにも一致して中身だけ90°回る**。
   API が無い環境のためにメディアクエリも残すが、JS が効く環境では body.noflip で無効化する。 */
@media (orientation: landscape) and (pointer: coarse) {
  html { overflow-x: hidden; }
  body:not(.noflip) {
    position: absolute;
    top: 100vh;
    left: 0;
    width: 100vh;          /* 縦画面の幅 = 端末の短辺 */
    height: 100vw;         /* 縦画面の高さ = 端末の長辺 */
    transform: rotate(-90deg);
    transform-origin: left top;
    overflow-x: hidden;
    overflow-y: auto;
  }
}
body.flip {                      /* 端末が横向きのときだけ JS が付ける */
  position:absolute; top:100vh; left:0; width:100vh; height:100vw;
  transform:rotate(-90deg); transform-origin:left top; overflow-x:hidden; overflow-y:auto;
}

/* ── 圧縮モード ────────────────────────────────────────────
   高さが足りない枠（画面分割など）では、走行中に使わないものを畳んで図に高さを回す。
   タイトル/版・下部のリンク列を隠し、ログを1行にする。281px → 148px。
   接続と REC は残す（再接続と記録の開始/停止は走行中に要る）。 */
/*
 * 操作系は1行に並べる。DOM の順序は
 *   vtabs / gaugeView / flowView / hdr / connBtn / log-wrap / recBtn / navbar
 * で、隣り合っていないので flex では1行にできない。**Grid で明示配置する**ことで
 * DOM を触らずに並べ替える（replay/video や通常モードに一切影響しない）。
 *
 *   行1  図（残り全部の高さ）
 *   行2  [FLOW|GAUGE]  [接続]  [REC]  [GPS]  ●
 *   行3  ログ1行
 */
body.compact .app {
  display:grid; height:100svh; box-sizing:border-box; padding:3px 6px 4px; gap:4px;
  grid-template-columns:auto 1fr 1fr auto auto;
  grid-template-rows:1fr auto auto;
}
body.compact #flowView,
body.compact #gaugeView { grid-column:1/-1; grid-row:1; min-height:0; overflow:hidden; }
body.compact #flowView  { display:flex; }
body.compact #flowSvg   { width:100%; height:100%; margin:0; }
body.compact .vtabs     { grid-column:1; grid-row:2; margin:0; gap:4px; }
body.compact #connBtn   { grid-column:2; grid-row:2; margin:0; }
body.compact #recBtn    { grid-column:3; grid-row:2; margin:0; }
body.compact .navbar    { grid-column:4; grid-row:2; margin:0; }
body.compact .hdr       { grid-column:5; grid-row:2; margin:0; padding:0 2px; border:none; }
body.compact .log-wrap  { grid-column:1/-1; grid-row:3; margin:0; }

/* 走行中に押さないものを畳む。GPS と状態ランプは残す */
body.compact .navbar > *:not(#gpsBtn) { display:none; }
body.compact .logo, body.compact #sttTxt { display:none; }
/* 状態文字を畳むぶんランプだけが状態を伝える。未接続の暗い色のままでは背景に
   埋もれるので、圧縮時は少し大きく・枠を明るくする（再接続中の橙は元から目立つ） */
body.compact .dot { width:12px; height:12px; border-color:#5a7a9a; }
body.compact .log  { height:16px; padding:2px 8px; line-height:1.5; overflow:hidden; }
body.compact .conn-btn { padding:7px 6px; font-size:10px; letter-spacing:1px; white-space:nowrap; }
body.compact .vtab { padding:5px 6px; }

/* VIEW TABS (フロー / ゲージ) */
.vtabs{display:flex;gap:5px;margin:2px 0 7px;}
.vtab{flex:1;padding:7px;background:#0a1520;border:1px solid #1a2a3a;border-radius:7px;
  color:#2a5a7a;font-family:'Courier New',monospace;font-size:11px;letter-spacing:2px;cursor:pointer;transition:all .15s;}
.vtab.active{border-color:#3a8aff;color:#4a9eff;background:#0d1e30;}
#flowView{width:100%;overflow:hidden;}
#flowSvg{display:block;width:100%;height:auto;background:#0a1520;border:1px solid #1a2a3a;border-radius:10px;margin-bottom:8px;}</style>
</head>

      <text x="100" y="133" text-anchor="middle" fill="#2a5a7a" font-size="11" font-family="Courier New" letter-spacing="1">kW</text>
      <text x="22" y="178" text-anchor="middle" fill="#1e3a5a" font-size="10" font-family="Courier New">0</text>

<script type="module">
import { CAL, decode2920, powers } from './lib/did2920.js';
/*
 * 版。中身を変えたら必ず上げる。日付 + 同日内の連番(a,b,c…)。
 * ここが唯一の出どころで、画面ヘッダ・保存ログの見出し・起動時のログ行に流し込む。
 * GitHub Pages はブラウザキャッシュが効くので、手元が新しい版かどうかは
 * 画面右上と保存ログの App: 行で確かめる。取得したログがどの版のものかも
 * これで後から特定できる。
 */
const APP_VER = 'v20260920f';

// ─── Log ─────────────────────────────────────────────────
let logBuffer = [];
let logRecording = false;
let gpsEnabled = false;   // GPS(GPX)記録トグル。状態は localStorage 永続
let gpsWatchId = null;    // watchPosition のID
let gpsBuffer = [];       // {time(ISO), lat, lon, ele, spd, acc}

function log(msg, cls) {
  const now = new Date();
  const ts = now.toISOString().slice(11, 23);
  if (logRecording) logBuffer.push({ ts, cls: cls || '', msg });
  const box = document.getElementById('logBox');
  const s = document.createElement('span');
  if (cls) s.className = cls;
  s.textContent = '[' + ts + '] ' + msg;
  box.appendChild(s);
  box.appendChild(document.createElement('br'));
  box.scrollTop = box.scrollHeight;
  while (box.children.length > 200) {
    box.removeChild(box.firstChild);
    box.removeChild(box.firstChild);
  }
}

// 版を画面と起動ログの両方に出す（log() と let 宣言より後で呼ぶ必要がある）
document.getElementById('verTxt').textContent = APP_VER;
log('FL4 OBD MONITOR ' + APP_VER, 'ok');

function toggleRec() {
  const btn = document.getElementById('recBtn');
  if (!logRecording) {
    logBuffer = [];
    logRecording = true;
    btn.textContent = '■ STOP';
    btn.classList.add('rec');
    log('--- REC START --- ' + APP_VER, 'ok');
    syncGpsRecording();
  } else {
    logRecording = false;
    btn.textContent = '● REC';
    btn.classList.remove('rec');
    syncGpsRecording();
    if (logBuffer.length === 0) return;
    const lines = logBuffer.map(e => `[${e.ts}] [${(e.cls||'   ').padEnd(3)}] ${e.msg}`);
    const text = 'FL4 OBD MONITOR LOG\n' +
      'App: ' + APP_VER + '\n' +
      'Generated: ' + new Date().toISOString() + '\n' +
      '='.repeat(60) + '\n' + lines.join('\n');
    const blob = new Blob([text], { type: 'text/plain' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = 'fl4obd_' + new Date().toISOString().slice(0,19).replace(/:/g,'-') + '.txt';
    a.click();
    URL.revokeObjectURL(url);
  }
}

// ─── GPS (GPXトラック記録) ───────────────────────────────
// トグルON時、REC録画中に watchPosition で座標を溜め、
// 録画終了時に GPX を書き出す。時刻は toISOString() で他ログと共通。
function recordingActive() { return logRecording; }

function onGpsFix(pos) {
  const c = pos.coords;
  gpsBuffer.push({
    time: new Date(pos.timestamp).toISOString(),   // 測位時刻(ISO, UTC) = 他ログと同基準
    lat: c.latitude, lon: c.longitude,
    ele: (c.altitude != null ? c.altitude : null),
    spd: (c.speed  != null ? c.speed  : null),      // m/s (端末による)
    acc: c.accuracy
  });
}
function onGpsErr(e) { log('GPS: ' + e.message, 'err'); }

function startGps() {
  if (!gpsEnabled || gpsWatchId != null) return;
  if (!navigator.geolocation) { log('GPS: 非対応ブラウザ', 'err'); return; }
  gpsBuffer = [];
  gpsWatchId = navigator.geolocation.watchPosition(onGpsFix, onGpsErr,
    { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 });
  log('--- GPS START ---', 'ok');
}
function stopGps() {
  if (gpsWatchId != null) { navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId = null; }
}
// 測位が途切れた区間（トンネル等）は <trkseg> を分ける。
// 1本の trkseg に入れると地図側が穴を直線で結んでしまい、走っていない経路が描かれる。
// 記録自体は途切れておらず、点は連続して溜まっている（途絶=区間の切れ目として表現するだけ）。
const GPX_SEG_GAP = 10;   // 秒。これを超える間隔で区間を切る

function exportGpx() {
  if (gpsBuffer.length === 0) return;
  const segs = [];
  let cur = [];
  let prev = null;
  for (const p of gpsBuffer) {
    const t = Date.parse(p.time);
    if (prev != null && (t - prev) / 1000 > GPX_SEG_GAP) { segs.push(cur); cur = []; }
    cur.push(p);
    prev = t;
  }
  if (cur.length) segs.push(cur);
  const body = segs.map(seg => '<trkseg>\n' + seg.map(p => {
    let s = '<trkpt lat="' + p.lat.toFixed(7) + '" lon="' + p.lon.toFixed(7) + '">';
    if (p.ele != null) s += '<ele>' + p.ele.toFixed(1) + '</ele>';
    s += '<time>' + p.time + '</time></trkpt>';
    return s;
  }).join('\n') + '\n</trkseg>').join('\n');
  const gpx =
    '<?xml version="1.0" encoding="UTF-8"?>\n' +
    '<gpx version="1.1" creator="fl4obd" xmlns="http://www.topografix.com/GPX/1/1">\n' +
    '<trk><name>fl4obd ' + new Date().toISOString() + '</name>\n' +
    body + '\n</trk>\n</gpx>\n';
  const blob = new Blob([gpx], { type: 'application/gpx+xml' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'fl4obd_' + new Date().toISOString().slice(0,19).replace(/:/g,'-') + '.gpx';
  a.click();
  URL.revokeObjectURL(url);
  log('GPX ' + gpsBuffer.length + ' pts / ' + segs.length + ' seg 保存', 'ok');
  gpsBuffer = [];
}

// 録画の開始/終了時に呼ぶ: 録画中はGPS収集、全録画停止でGPX書き出し
function syncGpsRecording() {
  if (recordingActive()) { if (gpsEnabled) startGps(); }
  else { stopGps(); if (gpsEnabled) exportGpx(); }
}

function toggleGps() {
  gpsEnabled = !gpsEnabled;
  localStorage.setItem('gpsLog', gpsEnabled ? '1' : '0');
  const btn = document.getElementById('gpsBtn');
  if (btn) { btn.style.borderColor = gpsEnabled ? '#ffaa00' : '#1a3a5a';
             btn.style.color       = gpsEnabled ? '#ffaa00' : '#2a5a7a'; }
  log('GPS記録: ' + (gpsEnabled ? 'ON' : 'OFF'), 'ok');
  if (gpsEnabled && recordingActive()) startGps();
  else if (!gpsEnabled) stopGps();
}

// 起動時: localStorage からトグル状態を復元
(function initGps() {
  gpsEnabled = localStorage.getItem('gpsLog') === '1';
  const btn = document.getElementById('gpsBtn');
  if (btn && gpsEnabled) { btn.style.borderColor = '#ffaa00'; btn.style.color = '#ffaa00'; }
})();

// ─── SVGメーター描画ヘルパー ──────────────────────────────
// 中心(cx,cy)、半径r、開始角deg_start〜終了角deg_end の弧パスを返す
// 角度は12時=0、時計回り正
const CX = 100, CY = 105, R = 72;
const DEG_START = -140, DEG_END = 140; // 280°弧

function deg2rad(d) { return d * Math.PI / 180; }

function arcPoint(deg) {
  const r = deg2rad(deg - 90); // SVGはY下向きなので-90補正
  return { x: CX + R * Math.cos(r), y: CY + R * Math.sin(r) };
}

function arcPath(deg1, deg2) {
  const p1 = arcPoint(deg1), p2 = arcPoint(deg2);
  const span = deg2 - deg1;
  const large = span > 180 ? 1 : 0;
  return `M${p1.x.toFixed(2)},${p1.y.toFixed(2)} A${R},${R} 0 ${large},1 ${p2.x.toFixed(2)},${p2.y.toFixed(2)}`;
}

// 弧の総長さ (280° / 360° × 2πR)
const ARC_LEN = (280 / 360) * 2 * Math.PI * R;
const ARC_HALF = ARC_LEN / 2;

// 背景弧を初期化
function initBgArc(id) {
  const el = document.getElementById(id);
  el.setAttribute('d', arcPath(DEG_START, DEG_END));
}
['bgRpm','bgSpd','bgPwr','bgPsys','bgPeng'].forEach(initBgArc);
// SOC固定色帯 (円弧に沿って色ゾーンを固定描画)
document.getElementById('bgSocLo').setAttribute('d',   arcPath(DEG_START, DEG_START + 0.25 * 280));
document.getElementById('bgSocNorm').setAttribute('d', arcPath(DEG_START + 0.25 * 280, DEG_START + 0.85 * 280));
document.getElementById('bgSocHi').setAttribute('d',   arcPath(DEG_START + 0.85 * 280, DEG_END));

// 値弧: ratio 0〜1 で左端から右端へ
function setArc(id, ratio) {
  ratio = Math.max(0, Math.min(1, ratio));
  const deg = DEG_START + ratio * 280;
  const el = document.getElementById(id);
  if (ratio === 0) { el.setAttribute('d', `M${arcPoint(DEG_START).x},${arcPoint(DEG_START).y}`); return; }
  el.setAttribute('d', arcPath(DEG_START, deg));
}

// 双極値弧: ratio -1〜+1、中央(deg=0°相当)から左右に伸びる
function setBiArc(idP, idN, idBar, idVal, ratio, colP, colN) {
  ratio = Math.max(-1, Math.min(1, ratio));
  const center = DEG_START + 140; // 280°の中央 = DEG_START+140
  const deg = center + ratio * 140;
  const pP = document.getElementById(idP);
  const pN = document.getElementById(idN);
  if (ratio >= 0) {
    pP.setAttribute('d', ratio > 0 ? arcPath(center, deg) : `M${arcPoint(center).x},${arcPoint(center).y}`);
    pN.setAttribute('d', `M${arcPoint(center).x},${arcPoint(center).y}`);
    setBar(idBar, deg, colP);
    document.getElementById(idVal).setAttribute('fill', colP);
  } else {
    pN.setAttribute('d', arcPath(deg, center));
    pP.setAttribute('d', `M${arcPoint(center).x},${arcPoint(center).y}`);
    setBar(idBar, deg, colN);
    document.getElementById(idVal).setAttribute('fill', colN);
  }
}

// インジケーターバー: 弧上の点から中心方向に短いバー（半径方向）
function setBar(id, deg, color) {
  const r = deg2rad(deg - 90);
  const cos = Math.cos(r), sin = Math.sin(r);
  const x1 = CX + (R - 10) * cos, y1 = CY + (R - 10) * sin;
  const x2 = CX + (R + 10) * cos, y2 = CY + (R + 10) * sin;
  const el = document.getElementById(id);
  el.setAttribute('x1', x1.toFixed(2)); el.setAttribute('y1', y1.toFixed(2));
  el.setAttribute('x2', x2.toFixed(2)); el.setAttribute('y2', y2.toFixed(2));
  if (color) el.setAttribute('stroke', color);
}

// 中央マーク初期化 (双極ゲージ用: Pbat/Psys)
function initCenterMark(id) {
  const center = DEG_START + 140;
  const r = deg2rad(center - 90);
  const cos = Math.cos(r), sin = Math.sin(r);
  const el = document.getElementById(id);
  el.setAttribute('x1', (CX + (R-8)*cos).toFixed(2));  el.setAttribute('y1', (CY + (R-8)*sin).toFixed(2));
  el.setAttribute('x2', (CX + (R+8)*cos).toFixed(2));  el.setAttribute('y2', (CY + (R+8)*sin).toFixed(2));
}
initCenterMark('centerPwr');
initCenterMark('centerPsys');

// ─── Vehicle data ─────────────────────────────────────────
// D は lib/flow.js が宣言する（drawFlow が参照する現在値）。ここでは初期値を入れるだけ。
// fuelShow: 012F を取りにいくのはこのアプリだけなので、枠を出すのもここだけ。
// リプレイ/動画は D.fuelLvl を持たないため何も描かれない。
Object.assign(D, { engRot:0, soc:NaN, pbat:0, vsp:0, psys:0, peng:0, runMode:-1, pgen:0, pdrive:0, dispMode:-1, fuelShow:true });
// 係数と byte offset は lib/did2920.js（唯一の定義元）。
let systemVolt = 0;
let socPrevT = 0;          // 前回2920フレーム時刻(内挿の積分起点)
let runTimeBase = 0;
let syncTimeMs  = null;

function getRtSec() {
  if (syncTimeMs === null) return null;
  return runTimeBase + Math.floor((Date.now() - syncTimeMs) / 1000);
}

// ─── Render ───────────────────────────────────────────────
function render() {
  // Vsp 0-180 (svgSpd を再利用)
  const spdR = Math.max(0, Math.min(D.vsp, 180)) / 180;
  setArc('arcSpd', spdR);
  setBar('barSpd', DEG_START + spdR * 280, '#00ff88');
  document.getElementById('valSpd').textContent = Math.round(D.vsp);

  // Psys 双極 ±140 kW
  const psysR = Math.max(-1, Math.min(D.psys / 140, 1));
  setBiArc('arcPsysP', 'arcPsysN', 'barPsys', 'valPsys', psysR, '#00e5ff', '#cc44ff');
  document.getElementById('valPsys').textContent = D.psys.toFixed(1);

  // Peng 0-110 kW
  const pengR = Math.max(0, Math.min(D.peng, 110)) / 110;
  setArc('arcPeng', pengR);
  setBar('barPeng', DEG_START + pengR * 280, '#ff5533');
  document.getElementById('valPeng').textContent = D.peng.toFixed(1);

  // Pbat 双極 -50..+50 kW (svgPwr を再利用)
  const pwrR = Math.max(-1, Math.min(D.pbat / 50, 1));
  setBiArc('arcPwrP', 'arcPwrN', 'barPwr', 'valPwr', pwrR, '#ffaa00', '#cc44ff');
  document.getElementById('valPwr').textContent = D.pbat.toFixed(1);

  // ENGrpm 0-8000 (svgRpm を再利用)
  const rpmR = Math.max(0, Math.min(D.engRot, 8000)) / 8000;
  setArc('arcRpm', rpmR);
  setBar('barRpm', DEG_START + rpmR * 280, '#4a9eff');
  document.getElementById('valRpm').textContent = Math.round(D.engRot);

  // Psoc 0-100
  const socValid = !isNaN(D.soc);
  const socR = socValid ? Math.max(0, Math.min(D.soc, 100)) / 100 : 0;
  // HEV自然域: 25〜85%。域外は警告色
  const nc = !socValid ? '#2a5a7a'
           : D.soc < 25 ? '#ff4444'   // 枯渇域
           : D.soc > 85 ? '#ffaa00'   // 過充電域
           : '#00ffcc';               // 正常域
  // 未達部分オーバーレイ: SOC位置から終端まで暗くする
  const socDeg = DEG_START + socR * 280;
  const arcSocEl = document.getElementById('arcSoc');
  arcSocEl.setAttribute('d', socR >= 1
    ? `M${arcPoint(DEG_END).x.toFixed(2)},${arcPoint(DEG_END).y.toFixed(2)}`
    : arcPath(socDeg, DEG_END));
  setBar('barSoc', socDeg, nc);
  const socEl = document.getElementById('valSoc');
  socEl.textContent = socValid ? D.soc.toFixed(1) : '--';
  socEl.setAttribute('fill', nc);

  // Text row: RunMode
  const dm = (D.dispMode >= 0) ? D.dispMode : D.runMode;   // 遷移ホールド後のモード
  document.getElementById('txtMode').textContent =
    (dm >= 0 && MODE_LABELS[dm]) ? MODE_LABELS[dm]
    : (dm >= 0 ? '0x' + dm.toString(16).toUpperCase() : '--');

  // Text row: Vsys (12V)
  document.getElementById('txtVsys').innerHTML =
    systemVolt ? systemVolt.toFixed(1) + ' <small style="font-size:12px;color:#2a5a7a">V</small>'
               : '--.- <small style="font-size:12px;color:#2a5a7a">V</small>';

  // Text row: RunTime
  const rtSec = getRtSec();
  if (rtSec === null) {
    document.getElementById('txtTime').textContent = '--:--:--';
  } else {
    const h = Math.floor(rtSec / 3600);
    const m = Math.floor((rtSec % 3600) / 60);
    const s = rtSec % 60;
    document.getElementById('txtTime').textContent =
      String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }

  if (currentView === 'flow') drawFlow();
}

// ─── エネルギーフロー図 (BAT/GEN/ENG/TRC + 車輪) ───────────
let currentView = 'flow';          // 既定はフロー図。ゲージはタブ/スワイプで出すサブ表示
function setView(v){
  currentView = v;
  document.getElementById('gaugeView').style.display = (v==='gauge')?'':'none';
  document.getElementById('flowView').style.display  = (v==='flow') ?'':'none';
  document.getElementById('tabGauge').classList.toggle('active', v==='gauge');
  document.getElementById('tabFlow').classList.toggle('active',  v==='flow');
  if (v==='flow') drawFlow();
}
/*
 * ── 枠に合わせてレイアウトを選ぶ ──────────────────────────
 *
 * 縦長 380×600 は幅基準で拡大されるため、高さの取れない枠（画面分割など）では
 * はみ出して切れる。入る高さが無ければ横長 640×240 に切り替え、併せて走行中に
 * 使わない要素を畳む（body.compact）。**切替は viewBox で行い、flow.js が
 * それを見てレイアウトを選ぶ**ので、replay/video は 380×600 のまま影響を受けない。
 *
 * 強制ポートレートの回転は screen.orientation（端末の向き）で判定する。
 * ビューポートの縦横比で判定すると、画面分割で横長のペインになったときにも
 * 一致して中身だけ90°回ってしまう。
 */
/*
 * 圧縮に入るしきい値。縦長の図は幅の 600/380 = 1.58 倍の高さを要求し、操作系を足すと
 * 枠の高さは幅の 2.3 倍ほど要る。全画面（縦横比 2.1 前後）は多少スクロールすれば
 * 使えるので従来のまま。**1.6 を下回ると図が実用にならない**ので、そこで切り替える。
 *   全画面 411×860 = 2.09 → 通常 / 分割 411×495 = 1.20 → 圧縮 / 横長 740×300 = 0.41 → 圧縮
 */
const COMPACT_RATIO = 1.6;
let uiState = 'off';        // setUI の最後の状態。圧縮の切替でラベルを付け直すのに使う
function applyLayout() {
  const land = /^landscape/.test((screen.orientation || {}).type || '');
  document.body.classList.toggle('noflip', !!(screen.orientation || {}).type);
  document.body.classList.toggle('flip', land);
  const w = document.querySelector('.app').clientWidth || window.innerWidth;
  const h = land ? window.innerWidth : window.innerHeight;      // 回転時は入れ替わる
  const compact = h < w * COMPACT_RATIO;
  const was = document.body.classList.contains('compact');
  document.body.classList.toggle('compact', compact);
  if (was !== compact) setUI();      // ボタンの文言を長短で入れ替える
  const svg = document.getElementById('flowSvg');
  const vb = compact ? '0 0 640 240' : '0 0 380 600';
  if (svg.getAttribute('viewBox') !== vb) {
    svg.setAttribute('viewBox', vb);
    svg.setAttribute('width', compact ? 640 : 380);
    svg.setAttribute('height', compact ? 240 : 600);
    if (currentView === 'flow') drawFlow();
  }
}
addEventListener('resize', applyLayout);
if (screen.orientation) screen.orientation.addEventListener('change', applyLayout);
applyLayout();

drawFlow();   // 既定がフロー図なので、接続前でも初期値で描いておく（空の SVG を見せない）

// ─── スワイプで FLOW ⇄ GAUGE 切替（タブと併用） ─────────────
(function(){
  const VIEWS = ['flow','gauge'];
  let x0=null, y0=null;
  function onStart(e){ const t=e.changedTouches[0]; x0=t.clientX; y0=t.clientY; }
  function onEnd(e){
    if(x0==null) return;
    const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    x0=null;
    if(Math.abs(dx)<50 || Math.abs(dx)<Math.abs(dy)*1.2) return;  // 横方向の明確なスワイプのみ
    const i=VIEWS.indexOf(currentView);
    const ni = dx<0 ? i+1 : i-1;                                  // 左スワイプ=次(GAUGE), 右=前(FLOW)
    if(ni>=0 && ni<VIEWS.length && ni!==i) setView(VIEWS[ni]);
  }
  for(const id of ['gaugeView','flowView']){
    const el=document.getElementById(id);
    el.addEventListener('touchstart', onStart, {passive:true});
    el.addEventListener('touchend',   onEnd,   {passive:true});
  }
})();


// モード遷移ホールド(ルールA): 遷移コード10/30/60/70を直前の安定モードで埋める。
// RUN MODE ゲージのちらつきを抑える用途。フロー図のトポロジ/ラベルは D.rawMode(生モード)側で決める。
let stableMode = -1;
function updateStableMode(m){
  if(m===20||m===40||m===50) stableMode=m;                            // 70は遷移(クラッチ開放準備)なので除く
  else if(m===10 && stableMode===20) stableMode=40;                   // EV→(10)→SER 確定
  else if(m===30 && (stableMode===40||stableMode===50)) stableMode=20; // SER/DIR→(30)→EV 確定
  // 60・70・その他 は直前ホールド
  return stableMode;
}

// ─── ELM327 レスポンスパーサー ────────────────────────────
//
// 【実ログから判明したフォーマット】
//   ATS0を送っているがこのELM327はスペースなし・8バイト固定長で返す。
//   1フレーム = 16文字(hex) = 8バイト固定。複数フレームは連結。
//
//   シングルフレーム例:
//     "410D0055555555"  → [41][0D][00][55][55][55][55] + 末尾パッド
//      └─ SID=0x41, PID=0x0D, data[0]=0x00
//
//   マルチフレーム例(PID 9A):
//     "008 0:419A07004245 1:000D55555555"
//      └─ ELM327独自フォーマット: "バイト数 0:FF行 1:CF行 ..."
//         0:行 → First Frame ペイロード (SID PID d0 d1 d2 d3 d4)
//         1:行 → Consecutive Frame ペイロード (d5 d6 d7 d8 d9 dA dB)
//
// 【取得するPIDと変換式】
//   PID 0x0C  engRot = (A<<8|B) / 4.0        [rpm]
//   PID 0x0D  vsp    = A                      [km/h]
//   PID 0x5B  soc    = A * 100.0 / 255.0      [%]
//   PID 0x1F  runtime= (A<<8|B)               [sec]
//   PID 0x9A  vbat   = (A<<8|B) / 64.0        [V]   ※マルチフレーム
//             ibat   = signed16(C<<8|D) * 0.1 [A]

// スペースなし連結hex文字列を16文字(8バイト)ずつ分割してバイト配列リストに変換
// "410D0055555555410C0000555555" → [[0x41,0x0D,...],[0x41,0x0C,...]]
function splitFrames(hexStr) {
  const frames = [];
  // 16文字 = 8バイト = 1 CAN フレーム
  for (let i = 0; i + 16 <= hexStr.length; i += 16) {
    const chunk = hexStr.slice(i, i + 16);
    const bytes = [];
    for (let j = 0; j < 16; j += 2)
      bytes.push(parseInt(chunk.slice(j, j + 2), 16));
    frames.push(bytes);
  }
  // 末尾に16文字に満たない残りがある場合も処理
  const rem = hexStr.length % 16;
  if (rem >= 4) {
    const chunk = hexStr.slice(hexStr.length - rem);
    const bytes = [];
    for (let j = 0; j + 1 < chunk.length; j += 2)
      bytes.push(parseInt(chunk.slice(j, j + 2), 16));
    frames.push(bytes);
  }
  return frames;
}

// OBD-II Service 01 シングルフレーム応答をデコード
// bytes[0]=0x41, bytes[1]=PID, bytes[2..]=data (0x55はパッド、無視)
function decodeService01(bytes) {
  if (bytes[0] !== 0x41) return;
  const pid  = bytes[1];
  const d    = bytes; // d[2], d[3], ... がデータバイト
  // d[2]以降がデータバイト (スケッチのbuf[3]以降に対応)
  switch (pid) {
    case 0x0C: // engRot = (buf[3]<<8|buf[4]) / 4.0
      D.engRot = ((d[2] << 8) | d[3]) / 4.0; break;
    case 0x0D: // vsp = buf[3]
      D.vsp = d[2]; break;
    case 0x5B: // soc = buf[3] * 100.0 / 255.0
      D.soc = d[2] * 100.0 / 255.0; break;
    case 0x05: // tw = buf[3] - 40.0
      D.tw = d[2] - 40.0; break;
    case 0x3C: // tcat = (buf[3]<<8|buf[4]) / 10.0 - 40.0
      D.tcat = ((d[2] << 8) | d[3]) / 10.0 - 40.0; break;
    case 0x1F: // runtime = buf[3]<<8|buf[4]
      runTimeBase = (d[2] << 8) | d[3];
      syncTimeMs  = Date.now(); break;
    case 0x42: // Control Module Voltage = (A*256+B)/1000 [V]
      systemVolt = ((d[2] << 8) | d[3]) / 1000.0; break;
    case 0x67: // Engine coolant temp (multi-sensor) A=bitmap B=sensor1 C=sensor2
      if (d[2] & 0x01) D.engTemp = d[3] - 40; break;
    case 0x3C: // Catalyst temp = (A*256+B)/10 - 40 [℃]
      D.catTemp = ((d[2] << 8) | d[3]) / 10.0 - 40.0; break;
    case 0x68: // Intake air temp (multi-sensor) A=bitmap B=sensor1
      if (d[2] & 0x01) D.intTemp = d[3] - 40; break;
    case 0x2F: // Fuel Tank Level Input = 100A/255 [%] (TA=0x10 のみ応答)
      D.fuelLvl = d[2] * 100.0 / 255.0;
      // 生応答(← 412FXX)だけだと保存ログから拾いにくいので数値でも残す。
      // 停車継続も併記する。走行中の点と停車中の点を後から分けて評価するため
      // （GPX と突き合わせずに済む）
      log('燃料残量 ' + D.fuelLvl.toFixed(1) + ' % (raw ' + d[2] + '/255) '
          + (stopSince ? '停車' + Math.round((Date.now() - stopSince) / 1000) + 's' : '走行中'), 'ok');
      break;
  }
}

// ─── Service 22 DID (ECU 0x07) パース ─────────────────────
// 再組立て後の応答: 62 29 XX <payload...>  (XX=DID下位)
// フィールドマップの byte offset N → 応答byte index = N+2
function parse22_2920(hex) {
  const f = decode2920(hex);                 // フィールド定義は lib/did2920.js
  if (!f) return;                            // byte100(eng_rpm) まで必要
  const pbat = f.pbat;
  D.vsp     = f.vsp;
  D.engRot  = f.rpm;
  D.pbat    = pbat;
  D.runMode = f.mode;
  D.rawMode = f.mode;                                 // フロー図のトポロジは生モードで決める
  D.dispMode = updateStableMode(f.mode);              // モード遷移ホールド(10/30/60を吸収)
  Object.assign(D, powers(f));                        // peng / pgen / pdrive / psys
  systemVolt = f.v12;                                 // 12V系電圧 = byte14(bit112) ×0.1V/LSB (PID42と等価・高レート)
  // SOC内挿(表示用のみ): 5B(30秒毎)の間を ∫Pbat で前進。5B受信時(case 0x5B)に真値へ再アンカー。
  // ※ログは生の5B/2920フレームのみ(この D.soc は表示専用で記録しない)。
  const _now = Date.now();
  if (!isNaN(D.soc) && socPrevT) { const dt = (_now - socPrevT) / 3600000;
    if (dt > 0 && dt < 0.02) D.soc = Math.max(0, Math.min(100, D.soc + CAL.SOC_K * pbat * dt)); }
  socPrevT = _now;
}

// PID 9A マルチフレーム処理
// 実ログで確認された問題:
//   FFとCFが">"をまたいで別ブロックに届く場合がある
//   例: ブロックA末尾 "... 0:419A070042BE"
//       ブロックB先頭 "1:00045555555555 ..."
// → pendingFF に FF ペイロードを保存し、次のブロックでCFが来たら結合してデコード

let pendingFF = null; // FFペイロードhex文字列を一時保存

function applyMulti9A(ff_hex, cf_hex) {
  // J1979-DA PID 0x9A: Hybrid/EV Vehicle System Data (6 data bytes A-F)
  // ELM327レスポンス FF: [SID=0x41][PID=0x9A][A][B][C][D]
  //                 CF: [E][F][pad...]
  // Voltage [V] = (256×C + D) / 64
  // Current [A] = signed16(256×E + F) × 0.1

  const ff = [];
  for (let i = 0; i + 1 < ff_hex.length; i += 2)
    ff.push(parseInt(ff_hex.slice(i, i + 2), 16));
  if (ff[0] !== 0x41 || ff[1] !== 0x9A) { pendingFF = null; return; }

  D.vbat = ((ff[4] << 8) | ff[5]) / 64.0;

  if (cf_hex && cf_hex.length >= 4) {
    const cf = [];
    for (let i = 0; i + 1 < cf_hex.length; i += 2)
      cf.push(parseInt(cf_hex.slice(i, i + 2), 16));

    // E=cf[0], F=cf[1] → signed16
    const rawEF = (cf[0] << 8) | cf[1];
    D.ibat = (rawEF >= 0x8000 ? rawEF - 0x10000 : rawEF) * 0.1;
    D.pbat = D.vbat * D.ibat * 0.001;

    // デバッグ: 生値を全部ログに出す
    log('[9A] FF=' + ff_hex +
        ' A=' + ff[2].toString(16).padStart(2,'0') +
        ' B=' + ff[3].toString(16).padStart(2,'0') +
        ' C=' + ff[4].toString(16).padStart(2,'0') +
        ' D=' + ff[5].toString(16).padStart(2,'0'), 'tx');
    log('[9A] CF=' + cf_hex.slice(0,4) +
        ' E=' + cf[0].toString(16).padStart(2,'0') +
        ' F=' + cf[1].toString(16).padStart(2,'0') +
        ' rawEF=0x' + rawEF.toString(16) +
        ' ibat=' + D.ibat.toFixed(1) + 'A' +
        ' vbat=' + D.vbat.toFixed(1) + 'V', 'tx');

    pendingFF = null;
  } else {
    log('[9A] FF only, waiting CF... FF=' + ff_hex, 'tx');
    pendingFF = ff_hex;
  }
}

// 1行から N:hex セグメントを全て抽出して返す
// 戻り値: { segments: {0: hex, 1: hex, ...}, remainderHex: "後続シングル連結hex" }
function extractSegments(line) {
  // ELM327のISO-TP行フォーマット: フレーム0〜9は "N:hex"(コロン付き)だが、
  // 10以降は "NNhex"(コロン無し・2桁10進+7バイト=16文字) で返すドングルがある。
  // 両形式をトークン単位で拾い、フレーム番号順に再組立てする。
  const segments = {};
  for (const tok of line.trim().split(/\s+/)) {
    let m;
    if ((m = tok.match(/^([0-9A-Fa-f]{1,2}):([0-9A-Fa-f]+)$/))) {
      segments[parseInt(m[1], 16)] = m[2];              // "N:hex"
    } else if ((m = tok.match(/^(\d\d)([0-9A-Fa-f]{14})$/))) {
      segments[parseInt(m[1], 10)] = m[2];              // "NN"+7バイト(コロン無し, 10以降)
    }
    // それ以外(長さヘッダ "06F" 等)は無視
  }
  return { segments, remainder: '' };
}

// ELM327の1応答ブロック(">"で区切られた単位)をパース
function parseBlock(block) {
  const lines = block.split(/\r\n|\r|\n/)
    .map(l => l.trim())
    .filter(l => l.length > 0 && l !== '?');

  const segAll = {}; // 全行から N:hex を集約 (ISO-TP マルチフレーム再組立て用)

  for (const line of lines) {
    if (/^(SEARCHING|NO DATA|ERROR|UNABLE|BUS)/i.test(line)) continue;

    // マルチフレーム関連行: "N:hex"(コロン付き 0-9) だけでなく、
    // このドングルがフレーム10-15を "NN"+7バイト(コロン無し・計16文字) で
    // 各行単独に返すケースも拾う。拾わないと10-15が捨てられ再組立てが69Bで打ち切られる。
    if (/\b[0-9A-Fa-f]{1,2}:[0-9A-Fa-f]/.test(line) ||
        /(^|\s)1[0-5][0-9A-Fa-f]{14}(\s|$)/.test(line)) {
      const { segments, remainder } = extractSegments(line);
      Object.assign(segAll, segments);
      // N:hexの後に続くシングルフレーム連結部分も処理
      if (remainder.length >= 14 && /^[0-9A-Fa-f]+$/.test(remainder)) {
        for (const bytes of splitFrames(remainder)) {
          if (bytes.length >= 3) decodeService01(bytes);
        }
      }
      continue;
    }

    // A:〜F: で始まるフレーム行を拾った後で、AT応答等の文字行を除外する。
    if (/^[A-Za-z]/.test(line) && !/^[46][0-9A-Fa-f]/i.test(line)) continue;

    // 純粋なシングルフレーム連結行 (Service01: 415B/4142/411F 等)
    const hex = line.replace(/\s+/g, '');
    if (!/^[0-9A-Fa-f]+$/.test(hex)) continue;
    for (const bytes of splitFrames(hex)) {
      if (bytes.length >= 3) decodeService01(bytes);
    }
  }

  // 集約したセグメントを昇順連結して再組立て → Service22 応答なら解析
  const idxs = Object.keys(segAll).map(Number).sort((a, b) => a - b);
  if (idxs.length) {
    let full = '';
    for (const i of idxs) full += segAll[i];
    if (/^6229/i.test(full)) parse22_2920(full); // 62 29 XX = ReadDataByID 応答
  }
}

function onRx(evt) {
  rxBuf += new TextDecoder().decode(evt.target.value);
  const parts = rxBuf.split('>');
  let gotResponse = false;
  for (let i = 0; i < parts.length - 1; i++) {
    const block = parts[i];
    const preview = block.replace(/[\r\n]+/g, ' ').trim();
    if (preview) log('← ' + preview, 'ok');
    parseBlock(block);
    if (pendingWait && block.includes(pendingWait.str)) pendingWait.resolve(block);
    gotResponse = true;
  }
  rxBuf = parts[parts.length - 1];
  if (gotResponse) stallCount = 0;   // 応答が来た＝リンク生存
  if (gotResponse && connected) {
    // 待っていない応答＝破棄済みの古い要求に対するもの。
    // ここで次を撃つとポーリングチェーンが増殖するので、continue させない。
    if (!awaiting) return;
    awaiting = false;
    sendNextPid();
  }
}
// ─── Screen Wake Lock ────────────────────────────────────
// 記録中に画面が消えるとページが hidden になり、JS のタイマーごと凍結する。
// 実測（2026-08-17〜19 の 6走行中 3走行）で 20〜46秒の凍結が起き、その間は
// pollWatchdog(1500ms) すら発火していなかった＝ストール検出でも拾えない。
// 取得の成否と解除をログに残す。logBuffer に入るので保存ログから後追いできる。
let wakeLock = null;
let wakeRetryAt = 0;       // 解除→再取得の暴走防止（最短間隔）

async function requestWakeLock() {
  if (!('wakeLock' in navigator)) { log('画面ロック: 非対応ブラウザ', 'e'); return; }
  if (wakeLock) return;    // 保持中。取り直すと古い参照を捨てて解放できなくなる
  try {
    const wl = await navigator.wakeLock.request('screen');
    wakeLock = wl;
    // OS 都合の解除（画面消灯・タブ切替・省電力）を拾う。
    // visibilitychange だけでは「可視のまま剥がされた」場合を取りこぼす。
    wl.addEventListener('release', () => {
      if (wakeLock === wl) wakeLock = null;
      log('画面ロック 解除', 'e');
      if (document.visibilityState === 'visible' && connected && Date.now() >= wakeRetryAt) {
        wakeRetryAt = Date.now() + 2000;
        requestWakeLock();
      }
    });
    log('画面ロック 取得', 'ok');
  } catch (e) {
    wakeLock = null;
    log('画面ロック 取得失敗: ' + e.name + ' / ' + e.message, 'e');
  }
}

function releaseWakeLock() {
  if (!wakeLock) return;
  const wl = wakeLock;
  wakeLock = null;         // release() の完了前に再入しても二重にならないよう先に落とす
  wl.release().catch(() => {});
}

// ページが再表示されたとき（通知バーを開けて戻るなど）に再取得
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') {
    // 凍結の開始点を記録しておく。これが無いとログが理由なく途切れて見える
    log('ページ非表示（画面消灯/バックグラウンド）', 'e');
    return;
  }
  log('ページ再表示', 'ok');
  requestWakeLock();                       // 非表示中に解放されたウェイクロックを再取得
  if (reconnecting || !connected) return;  // 再接続中/未接続はそれぞれの処理に委ねる
  // バックグラウンドでスロットルされ停止したポーリングを明示的に再始動。
  // リンクが実は切れていれば 無応答→ストール検出→forceReconnect が拾う。
  // 在飛行の要求は破棄する。残したままだと復帰後にチェーンが2本になる
  // （2026-08-09 トンネル通過時に発生。送信間隔 480→336ms、1行に応答2つ連結）。
  stallCount = 0;
  clearTimeout(pollWatchdog);
  awaiting = false;
  rxBuf = '';
  sendNextPid();
});

// ─── BLE ──────────────────────────────────────────────────
let bleDevice = null, bleChar = null, connected = false;
let rxBuf = '', pollWatchdog = null, demoTimer = null;
// 自動再接続 / ストール検出
let userDisc = false;      // [切断する]ボタンによる手動切断か
let reconnecting = false;  // 自動再接続ループ実行中ガード
let stallCount = 0;        // 連続無応答回数
let awaiting = false;      // ポーリング応答待ち中。同時に1要求だけを保証する
const STALL_LIMIT = 5;     // これ以上(≒7.5s無応答)で能動的に再接続

// 特定文字列を含むブロック（'>'区切り）が届くまで待つ
let pendingWait = null;
function waitForResponse(str, timeout) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      pendingWait = null;
      reject(new Error('timeout: ' + str));
    }, timeout);
    pendingWait = {
      str,
      resolve(text) { clearTimeout(timer); pendingWait = null; resolve(text); },
      reject(e)    { clearTimeout(timer); pendingWait = null; reject(e); }
    };
  });
}

async function sendRaw(s) {
  if (!bleChar) return;
  log('→ ' + s, 'tx');
  await bleChar.writeValue(new TextEncoder().encode(s + '\r'));
}

// ─── ポーリング ───────────────────────────────────────────
// レスポンス駆動: onRx で '>' 受信 → 即次コマンド送信。
// 基本は TA=0x07 (ATSH18DAF107) から取得:
//   222920 … 全ゲージ(Vsp/Psys/Peng/Pbat/ENGrpm/RunMode)。可能な限り高速、ただし100ms下限ガード
//   015B   … SOC   1秒ごとに1回だけ差し込む
//   0142   … 12V   5秒ごとに1回だけ差し込む
//   012F   … 燃料タンク残量。ECU 0x10 のみ応答。受信フィルタを切り替えて60秒ごと
const CMD_2920 = '222920';
const MIN_2920_INTERVAL = 100; // ms  2920の下限ガード
const SOC_INTERVAL = 30000;    // ms  SOCは30秒毎に間引き(∫Pbat内挿で~0.6%精度, 枠を2920に回す)
const V12_INTERVAL = 10000;    // ms  12Vも同様
const HDR_MAIN = '18DAF107';   // 常用(222920 / 015B)。実測でこれで応答している

/*
 * ── TA の読み分けは ATCRA（受信フィルタ）で行う。ATSH は使わない ──────
 *
 * 燃料タンク残量(PID 012F)は ECU 0x10 しか応答しない。ヘッダーを ATSH で
 * 切り替えて取ろうとして 2 日溶かしたが、**送信側は触る必要が無かった**。
 *
 * ATSP0(全自動)では要求がファンクショナルアドレスで出るため、全 ECU に届く。
 * ELM327 は "actually retrieves every message from the CAN bus, and then
 * decides whether or not to display it" なので、**どの応答を表示するかを
 * ATCRA で選ぶだけ**でよい。ATCRA(引数なし)で既定に戻る。
 *
 *   ATCRA18DAF110 → 012F → ATCRA     ← これだけ。0.35s / 回
 *
 * 実測 fl4obd_2026-08-19T14-08-19.txt(v20260819e):
 *   222920                → 正常（ベースライン）
 *   ATCRA18DAF107 → 222920 / 015B → いずれも正常   受信フィルタは無害
 *   ATCRA18DAF110 → 012F  → 412FE755555555 = 90.6%(231/255)
 *   ATCRA         → 222920 / 015B → 正常            完全復帰
 *
 * 逆に ATSH は、明示的に送った時点で以降すべて NO DATA になり切断まで戻らない。
 * 仕様どおりの要求 ID (ATSH18DA07F1 + ATFCSH18DA07F1 + ATCRA18DAF107) でも
 * 落ちた(v20260819d)。理由は未解明。**触らないこと。**
 *
 * 以下は調査中に読んだデータシートの該当箇所。ATSH に手を出す前に読むこと。
 *
 * ① ATSH のバイトの役割:
 *      "xx will be used for the first or priority/type byte, yy will be used
 *       for the second or receiver/target byte, and zz will be used for the
 *       third or transmitter/source byte"
 *    → SH 18 DA 10 F1 = 宛先 0x10 / 送信元 F1(テスタ)。これが要求として正しい。
 *      アプリの ATSH18DAF107 は「宛先 F1・送信元 07」で並びが逆。要求 ID に
 *      なっていない。ファームの makeId(ta,sa)=0x18DA0000|ta<<8|sa が正しい。
 *
 * ② 受信側は ATCRA で指定する（アプリは一度も使っていない）:
 *      "if you wish to be more specific and see only the OBD replies sent by
 *       the engine to the scan tool … >AT CRA 18 DA F1 10"
 *      "the ELM327 actually retrieves every message from the CAN bus, and then
 *       decides whether or not to display it"
 *
 * ③ 初期化時の ATSH がなぜ無害だったか:
 *      "If new values for header bytes are set before the vehicle protocol has
 *       been determined, and if the search is not set for fully automatic
 *       (ie other than protocol 0), these new values will be used"
 *    → ATSP0(全自動)なので初期化時の ATSH18DAF107 は使われず、探索も以降の
 *      通信も既定ヘッダーで走っていた。011F に複数行返るのもデータシートに
 *      例がある。初期化の ATSH/ATFCSH は事実上の飾りで、外しても動くはず
 *      （未確認なので残してある）。
 */
const CRA_FUEL = '18DAF110';   // ECU 0x10 → テスタ F1 の応答だけを通す
/*
 * 燃料タンク残量は停車中に集中して撃つ。
 *
 * 単発の値は使えない。実測(2026-08-19〜24, 10走行 122点)で 1走行内の幅が
 * 中央 16カウント=2.5L あり、11km走行の消費 0.6L より大きい。使える推定量は
 * 中央値で、偏差の 51% がログ中央値と完全一致する。つまり**点数が要る**。
 *
 * 一律 60秒では 1走行あたり停車中に当たるのが 0〜9点しかなく、中央値が立たない。
 * 車速ゼロならフロー図に見るものが無いので、その枠を燃料へ回す。
 *
 * これは「1回の停車の中で値がばらつくか」の検証も兼ねる。ばらつけば独立なので
 * 中央値で √n に落ちる。張り付くなら相関時間が停車より長く、**中央値では改善しない**
 * （日をまたいだ平均に頼ることになる）。60秒間隔の既存データでは区別できていない。
 *
 * 車速の穴は「燃料1組 + 2920 1回」= 266+448 = 714ms で頭打ちになる。1組に 012F を
 * 1本しか入れないため。まとめ撃ちすれば ATCRA の往復 104ms を節約できるが、
 * **発進検知の遅れの上限を買うために捨てている**。
 */
const FUEL_INTERVAL      = 60000;  // ms  走行中。推移の記録用
const FUEL_STOP_INTERVAL = 2000;   // ms  停車中の連射。ECU 側の更新が 1Hz 程度との見当
const STOP_SETTLE        = 5000;   // ms  停車がこれだけ続いてから連射に入る
/*
 * 1回の停車で撃つ上限。**停車中は値がまったく動かない**ので、それ以上は同じ数字を
 * 集めるだけになる。実測（2026-08-25 の3走行、停車エピソード 38件）で
 * エピソード内の幅は中央 0、23/33 が幅ゼロ。ばらつきは全部エピソード**間**にある。
 * 1回の停車＝1点の独立サンプルなので、確認用に数点あれば足りる。
 * 上限なしだと 331点で 88秒ぶんのポーリング時間を使う（有効なのは 23点）。
 */
const FUEL_STOP_MAX      = 3;

let last2920 = 0, lastSoc = 0, lastV12 = 0, lastFuel = 0;
let stopSince = 0;             // 車速ゼロが続き始めた時刻。0 = 走行中
let fuelStopN = 0;             // いまの停車で撃った回数
/*
 * 接続直後に停車中なら STOP_SETTLE を待たずに撃つ。記録の開始時点の値は
 * アンカーとして最も価値がある（そこから先の消費を積む起点になる）ので、
 * 待っている間に発進して取り逃すのを避ける。1回の停車ぶん撃ったら降りる。
 */
let startBurst = false;
let cmdSeq = [];               // 先頭から順に出し切る割り込みコマンド列

function buildCmdQueue() {
  // 接続直後: SOC/12Vを即時1回撮ってから 2920 ホットループに入る
  const now = Date.now();
  last2920 = 0; lastSoc = 0; lastV12 = 0; lastFuel = 0;
  // D.vsp の初期値が 0 なので、接続前から「停車中」と判定されて stopSince が起動時に
  // 立つ。捨てないと「停車39998s」のような値がログに出て、後から停車時間で層別できない
  stopSince = 0; fuelStopN = 0; startBurst = true;
  cmdSeq = [];                 // 再接続時に受信フィルタ切替の途中が残らないようにする
}

function sendNextPid() {
  if (!connected) return;
  if (awaiting) return;      // 応答待ち中は撃たない（チェーンは常に1本）
  clearTimeout(pollWatchdog);
  const now = Date.now();

  /*
   * 車速ゼロの継続を追う。この関数は 2Hz 前後で回るので分解能は足りる。
   * **車速が取れるまでは何も判定しない。** 未取得を走行中として扱うと、接続直後の
   * 1回目で startBurst が消えてしまい、停車中に即撃つ意味が無くなる。
   */
  if (Number.isFinite(D.vsp)) {
    if (D.vsp < 1) { if (!stopSince) stopSince = now; }
    else {
      /*
       * 発進した瞬間だけ連射を打ち切る。ATCRA を送らずに抜けると受信フィルタが
       * ECU 0x10 のままになり 2920 の応答まで捨てるので、012F だけ落として復帰は残す。
       *
       * **stopSince を見ずに毎周期これをやると、走行中に予約した 012F も必ず消える。**
       * v20260825a〜v20260826b はそうなっており、走行中の60秒ポーリングが一度も
       * 成立していなかった（実測3走行で走行中の取得が0件）。
       */
      if (stopSince && cmdSeq[0] === '012F') cmdSeq = ['ATCRA'];
      stopSince = 0; fuelStopN = 0; startBurst = false;
    }
  }
  const settled = stopSince && (startBurst || now - stopSince >= STOP_SETTLE) && fuelStopN < FUEL_STOP_MAX;

  let cmd;
  // 受信フィルタ切替の列は最優先で出し切る。途中で割り込むと 2920 の応答を
  // ECU 0x10 のフィルタで捨てることになる
  if (cmdSeq.length)                      { cmd = cmdSeq.shift(); }
  else if (now - lastSoc >= SOC_INTERVAL) { cmd = '015B'; lastSoc = now; }
  // 車速が取れるまでは撃たない。撃つと停車中でも「走行中」と記録され、後から
  // 停車時間で層別できなくなる。2920 は 0.5秒で返るので待ちは一瞬
  else if (Number.isFinite(D.vsp) && now - lastFuel >= (settled ? FUEL_STOP_INTERVAL : FUEL_INTERVAL)) {
    lastFuel = now;
    if (stopSince) fuelStopN++;
    cmd = 'ATCRA' + CRA_FUEL;
    cmdSeq = ['012F', 'ATCRA'];   // 012F が無応答でも最後の ATCRA で既定へ戻る
  }
  // 0142(12V)ポーリングは廃止: 12Vは 2920 byte14 で高レート取得(parse22_2920)
  else {
    // 2920 ホットループ + 100ms下限ガード
    const wait = MIN_2920_INTERVAL - (now - last2920);
    if (wait > 0) { pollWatchdog = setTimeout(sendNextPid, wait); return; }
    cmd = CMD_2920; last2920 = now;
  }
  awaiting = true;
  try { sendRaw(cmd); } catch(e) { awaiting = false; log('✗ send err: ' + e.message, 'e'); }
  // 無応答フォールバック(2920マルチフレームは重いので長め)
  pollWatchdog = setTimeout(onPollTimeout, 1500);
}

// 応答が1.5s来なかった時。連続 STALL_LIMIT 回で能動的に再接続
function onPollTimeout() {
  if (!connected) return;
  awaiting = false;          // 待ちを解除してから次を撃つ
  stallCount++;
  if (stallCount >= STALL_LIMIT) {
    log('無応答が続くため再接続します (' + stallCount + '連続)', 'e');
    stallCount = 0;
    forceReconnect();
    return;
  }
  sendNextPid();
}

async function initElm() {
  // 最初の ATZ は進行中コマンドの停止に消費される場合がある。
  // 空文字は任意の応答ブロックに一致し、STOPPED を含め '>' 受信まで待つ。
  const stopWait = waitForResponse('', 2000);
  try { await sendRaw('ATZ'); } catch(e) {}
  await stopWait;
  rxBuf = '';

  // ATZ 送信 → "ELM327" を含む応答が来るまで待つ（タイムアウト2秒）
  // 応答なし = 前回セッションのゴミが残っていて回復不能 → 例外で呼び出し元へ
  const atzWait = waitForResponse('ELM327', 2000);
  try { await sendRaw('ATZ'); } catch(e) {}
  await atzWait;

  const seq = [
    ['ATE0',            300],
    ['ATL0',            300],
    ['ATS0',            300],
    ['ATSP0',           500],
  ];
  // 初期化専用: 内容にかかわらず '>' まで待ち、前の要求を完了させる。
  async function initCommand(command, timeout) {
    const p = waitForResponse('', timeout);
    const waiter = pendingWait;
    try {
      const [, block] = await Promise.all([sendRaw(command), p]);
      return block;
    } catch(e) {
      if (pendingWait === waiter) waiter.reject(e);
      if (e.message === 'timeout: ') throw new Error('timeout: ' + command);
      throw e;
    }
  }

  for (const [c, d] of seq) {
    const block = await initCommand(c, 2000);
    if (!block.includes('OK')) throw new Error(c + ': ' + block.trim());
    await new Promise(r => setTimeout(r, d));
  }

  // ATSP0 後は自動探索があるため、各回最大20秒待つ（最大3回）。
  // '>' 未受信のタイムアウトは中止し、探索中に次の要求を送らない。
  for (let attempt = 0; attempt < 3; attempt++) {
    let block;
    try {
      block = await initCommand('011F', 20000);
    } catch(e) {
      log('RUNTIME 取得失敗 (' + (attempt + 1) + '/3)', 'e');
      throw e;
    }
    if (block.includes('411F') && !block.includes('STOPPED')) {
      // 確定プロトコルを既存の受信ログへ記録（固定指定には変更しない）。
      await initCommand('ATDPN', 2000);
      return;
    }
    log('RUNTIME 取得失敗 (' + (attempt + 1) + '/3)', 'e');
    // STOPPED / NO DATA 等もプロンプト受信済みの場合だけ再試行する。
    if (attempt < 2) await new Promise(r => setTimeout(r, 1000));
  }
  throw new Error('RUNTIME 取得失敗: 411F 応答なし');
}

// ─── BLE接続 ─────────────────────────────────────────────
// ELM327 BLEドングルは大きく2種類のサービスUUIDを使う:
//   Type A: 0000fff0-0000-1000-8000-00805f9b34fb  (FFF0/FFF1/FFF2)
//   Type B: e7810a71-73ae-499d-8c15-faa9aef0c3f2  (iOS用ドングルに多い)
// Chromeは optionalServices に短縮UUID(例: 'fff0')を渡すと
// 「bluetooth.com/specifications/gatt/services」のエラーを出すことがある。
// → 必ずフル128bit UUIDで指定する。
// → filters に name/namePrefix を並べ、どれにもマッチしない場合の
//   フォールバックとして acceptAllDevices:true を使う別ルートを用意する。

const SVC_UUIDS = [
  '0000fff0-0000-1000-8000-00805f9b34fb',
  'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
];

async function getBleChar(server) {
  for (const uuid of SVC_UUIDS) {
    try {
      const svc   = await server.getPrimaryService(uuid);
      const chars = await svc.getCharacteristics();
      log('サービス検出: ' + uuid.slice(4, 8), 'ok');

      let notifyChar = null, writeChar = null;
      for (const c of chars) {
        if (c.properties.notify || c.properties.indicate) notifyChar = c;
        if (c.properties.write  || c.properties.writeWithoutResponse) writeChar = c;
      }
      // 一部ドングルは同一キャラクタリスティックで読み書きする
      if (!writeChar && notifyChar) writeChar = notifyChar;
      if (!notifyChar && writeChar) notifyChar = writeChar;

      if (notifyChar) {
        await notifyChar.startNotifications();
        notifyChar.addEventListener('characteristicvaluechanged', onRx);
        log('Notify: ' + notifyChar.uuid.slice(4, 8), 'ok');
      }
      return writeChar;
    } catch(e) {
      // このサービスUUIDは未対応 → 次を試す
    }
  }
  throw new Error('対応サービスが見つかりません (FFF0/E781)');
}

async function toggleConnect() {
  // 接続中 or 再接続試行中に押されたら手動切断（自動再接続を止める）
  if (connected || reconnecting) { userDisc = true; doDisc(); return; }

  userDisc = false;
  stallCount = 0;

  if (!navigator.bluetooth) {
    log('✗ Web Bluetooth 非対応', 'e');
    log('✗ Android Chrome + HTTPS(またはlocalhost)が必要です', 'e');
    return;
  }

  setUI('chk');
  log('Bluetoothスキャン中...', 'tx');

  try {
    // フル128bit UUIDで optionalServices を指定
    // filters: よくある名前のドングルを優先
    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [
        { name: 'OBDII'    },
        { name: 'ELM327'   },
        { name: 'OBD2'     },
        { namePrefix: 'OBD'    },
        { namePrefix: 'ELM'    },
        { namePrefix: 'IOS'    },
        { namePrefix: 'Vlink'  },
        { namePrefix: 'KONNWEI'},
        { namePrefix: 'iCar'   },
        { namePrefix: 'Carista'},
        { services: ['0000fff0-0000-1000-8000-00805f9b34fb'] },
        { services: ['e7810a71-73ae-499d-8c15-faa9aef0c3f2'] },
      ],
      optionalServices: SVC_UUIDS,
    });

    bleDevice.addEventListener('gattserverdisconnected', () => {
      log('切断されました', 'e');
      if (userDisc) doDisc();       // 手動切断 → 破棄
      else attemptReconnect();      // 予期しない切断 → 自動再接続
    });

    log('接続中: ' + bleDevice.name, 'ok');
    const server = await bleDevice.gatt.connect();
    bleChar = await getBleChar(server);
    if (!bleChar) throw new Error('書き込みキャラクタリスティック未検出');

    stopDemo(); // 接続開始時にデモ停止

    rxBuf = '';
    awaiting = false;
    await initElm();
    connected = true;
    setUI('on');
    log('ポーリング開始', 'ok');
    requestWakeLock();
    buildCmdQueue();
    sendNextPid();

  } catch (e) {
    log('✗ ' + e.message, 'e');
    setUI('off');
  }
}

function doDisc() {
  reconnecting = false;
  clearTimeout(pollWatchdog);
  awaiting = false;
  releaseWakeLock();
  connected = false;
  if (bleDevice && bleDevice.gatt.connected) bleDevice.gatt.disconnect();
  bleDevice = bleChar = null;
  setUI('off');
}

// ストール検出時: リンクを一度落として自動再接続に乗せる
function forceReconnect() {
  if (reconnecting || userDisc) return;
  clearTimeout(pollWatchdog);
  awaiting = false;
  connected = false;
  if (bleDevice && bleDevice.gatt.connected) {
    bleDevice.gatt.disconnect();          // → gattserverdisconnected → attemptReconnect
  } else {
    attemptReconnect();                   // 既に切れている場合は直接
  }
}

// bleDevice 参照を保持したまま gatt.connect() で再接続（ユーザー操作不要）。
// 指数バックオフ 1→2→4→8s で成功するまで（手動切断まで）繰り返す。
async function attemptReconnect() {
  if (reconnecting || userDisc || !bleDevice) return;
  reconnecting = true;
  connected = false;
  clearTimeout(pollWatchdog);
  awaiting = false;
  // ウェイクロックは手放さない。再接続ループは成功するまで無限に回るため、
  // ここで解放するとトンネル等の切断中ずっと画面が消せる状態になる。
  // 画面が消えれば JS が凍結し、再接続そのものが止まる。
  setUI('rec');
  let delay = 1000;
  while (!userDisc && bleDevice) {
    try {
      log('再接続 試行...', 'tx');
      const server = await bleDevice.gatt.connect();
      bleChar = await getBleChar(server);
      if (!bleChar) throw new Error('書き込みキャラクタリスティック未検出');
      rxBuf = ''; stallCount = 0; awaiting = false;
      await initElm();
      if (userDisc) { doDisc(); return; }
      connected = true; reconnecting = false;
      setUI('on');
      log('再接続 成功', 'ok');
      requestWakeLock();
      buildCmdQueue();
      sendNextPid();
      return;
    } catch (e) {
      log('再接続失敗: ' + e.message + ' (' + (delay / 1000) + 's後に再試行)', 'e');
      await new Promise(r => setTimeout(r, delay));
      delay = Math.min(delay * 2, 8000);
    }
  }
  reconnecting = false;
  doDisc();   // 手動切断された or デバイス消失
}

function setUI(s) {
  uiState = s = s || uiState;        // 引数なしは「いまの状態で描き直す」
  const dot = document.getElementById('dot');
  const txt = document.getElementById('sttTxt');
  const btn = document.getElementById('connBtn');
  const busy = (s === 'chk' || s === 'rec');
  dot.className = 'dot ' + (s === 'on' ? 'on' : busy ? 'chk' : '');
  txt.textContent = s === 'on' ? 'CONNECTED' : s === 'chk' ? 'CONNECTING' : s === 'rec' ? 'RECONNECTING' : 'DISCONNECTED';
  txt.style.color  = s === 'on' ? '#00cc66' : busy ? '#ffaa00' : '#2a5a7a';
  // 圧縮モードは1行に5つ並ぶので文言を詰める（列幅に収まらないと切れる）
  const cmp = document.body.classList.contains('compact');
  btn.textContent  = (s === 'on' || s === 'rec')
    ? (cmp ? '[ 切断 ]' : '[ 切断する ]')
    : (cmp ? '[ 接続 ]' : '[ BLUETOOTH 接続 ]');
  btn.disabled     = (s === 'chk');   // 再接続中(rec)はボタン有効=中止可能
}

// ─── DEMO ─────────────────────────────────────────────────
let dSpd = 0, prevSpd = 0, dSoc = 62, dPhase = 0;
let demoRunning = false;

// 同定した i-MMD モデルに沿ったデモ:
// 車速プロファイルから車輪出力を出し、モード(EV/シリーズ/直結/回生)ごとに
// ENG/GEN/TRC/BAT の各出力を物理整合するよう生成する。※modeは【10進】。
function demoTick() {
  dPhase += 0.09;
  const target = 50 + 48 * Math.sin(dPhase * 0.55);      // 目標車速 2〜98 を緩やかに往復
  prevSpd = dSpd;
  dSpd = Math.max(0, dSpd + (target - dSpd) * 0.14);
  const acc = dSpd - prevSpd;                            // 加速度 [km/h/tick]

  // 車輪(TRC)出力[kW] = 転がり/空気抵抗 + 加速分。減速で負=回生
  let pdrive = dSpd * 0.18 + acc * 4.5 + (Math.random() - .5) * 1.2;
  const aux = 1.2;                                        // 補機負荷[kW]
  let mode, peng = 0, pgen = 0, pbat, rpm;

  if (pdrive < -0.5) {                    // 減速 → 回生 (EV状態)
    mode = 20; rpm = 0;
    pbat = pdrive + aux;                  // 充電=|回生|−補機消費 (負=充電)。BAT流入≤回生で保存
  } else if (dSpd < 22) {                 // 低速 → EV
    mode = 20; rpm = 0;
    pbat = pdrive / 0.9 + aux;            // 放電(モータ + 補機)
  } else if (dSpd > 66 && pdrive < 38) {  // 高速定常 → 直結
    mode = 50;
    rpm = 23 * dSpd + Math.random() * 80; // 直結の運動学 (eng_rpm ≈ 23×車速)
    peng = Math.max(pdrive * 0.82, 10);   // エンジンが車輪を機械直結駆動
    pbat = (pdrive - peng) / 0.9 + aux;   // 不足はモータ補助(放電)/エンジン余剰なら充電
    pgen = 0;                             // 直結では発電機は遊ぶ
  } else {                                // 中速/加速 → シリーズ
    mode = 40;
    peng = Math.max(pdrive, 6) + 4 + 3 * Math.sin(dPhase * 1.7);  // 需要 + 充電余裕
    rpm = 1200 + peng * 42 + Math.random() * 120;                 // 発電動作点(車速と非連動)
    pgen = peng * 0.95;                   // 発電機がエンジン機械出力を吸収(暖機後 ≈ENG)
    pbat = pdrive - pgen * 0.9 + aux;     // 差分: 発電>需要なら充電(負)
  }

  dSoc = Math.max(16, Math.min(92, dSoc - pbat * 0.0015));  // SOC は pbat に応じ緩変動
  D.vsp = dSpd; D.engRot = rpm; D.runMode = mode; D.rawMode = mode; D.dispMode = updateStableMode(mode); D.soc = dSoc;
  D.peng = peng; D.pgen = pgen; D.pdrive = pdrive; D.pbat = pbat;
  D.psys = pdrive + (mode === 50 || mode === 70 ? peng : 0);
  systemVolt = 12.4 + Math.random() * .4;
  if (syncTimeMs === null) { runTimeBase = 0; syncTimeMs = Date.now(); }
}

function startDemo() {
  if (demoTimer) return;
  demoRunning = true;
  document.getElementById('demoBtn').style.color = '#ffaa00';
  document.getElementById('demoBtn').style.borderColor = '#ffaa00';
  demoTimer = setInterval(demoTick, 600);
}

function stopDemo() {
  demoRunning = false;
  clearInterval(demoTimer); demoTimer = null;
  document.getElementById('demoBtn').style.color = '#2a5a7a';
  document.getElementById('demoBtn').style.borderColor = '#1a3a5a';
}

function toggleDemo() {
  if (connected) return; // 接続中はデモ不可
  demoRunning ? stopDemo() : startDemo();
}

// ─── 操作の割り当て ────────────────────────────────────────
// module スコープでは HTML の onclick 属性から関数を呼べないのでここで結ぶ。
document.getElementById('tabFlow').addEventListener('click', () => setView('flow'));
document.getElementById('tabGauge').addEventListener('click', () => setView('gauge'));
document.getElementById('connBtn').addEventListener('click', toggleConnect);
document.getElementById('recBtn').addEventListener('click', toggleRec);
document.getElementById('gpsBtn').addEventListener('click', toggleGps);
document.getElementById('demoBtn').addEventListener('click', toggleDemo);

// 起動時はデモOFF
setInterval(render, 200);
